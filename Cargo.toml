# File: Cargo.toml
# Purpose: Cargo package manifest, crate targets, and build profile configuration.

[package]
name = "protofire"
version = "0.8.1"
edition = "2021"
authors = ["Raiden Lumine"]
description = "A Rust bare-metal kernel prototype with a file-oriented user ABI."
license = "Apache-2.0"

[lints.rust]
# Edition 2024 makes this the default; on edition 2021 it is opt-in, and the
# kernel wants it now: an unsafe operation inside an unsafe function is a
# distinct statement from "this function's contract covers it" — the block is
# where the reason goes, and the compiler checks the placement rather than
# trusting the reader to notice it.
unsafe_op_in_unsafe_fn = "deny"

[lib]
name = "protofire"
crate-type = ["rlib"]

[[bin]]
name = "protofire"
path = "src/main.rs"
test = false
bench = false

[[test]]
name = "path"
path = "tests/fs/path.rs"

[[test]]
name = "fs_maintenance"
path = "tests/fs/maintenance.rs"

[[test]]
name = "servicefs"
path = "tests/fs/servicefs.rs"

[[test]]
name = "sync_lock"
path = "tests/fs/sync_lock.rs"

[[test]]
name = "fat32"
path = "tests/fat32.rs"

[[test]]
name = "simplefs"
path = "tests/simplefs/validation.rs"

[[test]]
name = "simplefs_fault_matrix"
path = "tests/simplefs/fault_matrix.rs"

[[test]]
name = "simplefs_recovery"
path = "tests/simplefs/recovery.rs"

[[test]]
name = "simplefs_property"
path = "tests/simplefs/property.rs"

[[test]]
name = "memory_manager"
path = "tests/memory/manager.rs"

[[test]]
name = "page_table"
path = "tests/memory/page_table.rs"

[[test]]
name = "memory_pressure"
path = "tests/memory/pressure.rs"

[[test]]
name = "condvar"
path = "tests/process/condvar.rs"

[[test]]
name = "scheduler"
path = "tests/process/scheduler.rs"

[[test]]
name = "process_stress"
path = "tests/process/stress.rs"

[[test]]
name = "console"
path = "tests/io/console.rs"

[[test]]
name = "keyboard"
path = "tests/io/keyboard.rs"

[[test]]
name = "io"
path = "tests/io/io.rs"

[[test]]
name = "net_fuzz"
path = "tests/net/fuzz.rs"

[[test]]
name = "syscall_fuzz"
path = "tests/syscall/fuzz.rs"

[[test]]
name = "syscall_abi_golden"
path = "tests/syscall/abi_golden.rs"

[[test]]
name = "usb_msd"
path = "tests/drivers/usb_msd.rs"

[[test]]
name = "parser_fuzz"
path = "tests/parsers/fuzz.rs"

[[test]]
name = "simplefs_undo_property"
path = "tests/simplefs/undo_property.rs"

[[test]]
name = "virgl_demo"
path = "tests/gpu/virgl_demo.rs"

[features]
default = []
demo-disk = []
# Enables the standalone ring3 runtime bridge (__shell_syscallN wrappers in
# src/user/shared/runtime.rs). Off in the kernel build: the kernel provides its
# own bridge in src/user/program/shell/syscall_bridge.rs.
runtime = []
# Ships the byte-for-byte payload frozen on 2026-09-27 instead of the one this
# build compiles, so the boot runs a program that was not rebuilt.  This is what
# makes "we do not break userspace" a testable claim; see
# `src/user/demo/demo_program_x86_64_rust_io.rs`.
abi_frozen_payload = []
fs_profiler = []
fs_lock_timing = []
heap_audit = []
liveness_heartbeat = []
# Asks the stack window and the posted-invalidation log for more than they can
# hold, so the fallbacks (frames at their own addresses, full TLB flushes) are
# exercised rather than merely reasoned about.  Used by the x86_64 runtime
# check; it costs tens of megabytes of frames for the moment it runs.
stack_churn = []
net_profiler = []
alloc_profiler = []
fault_profiler = []
educational_networking = []

[dependencies]

[profile.dev]
panic = "abort"
opt-level = 1
debug = true
debug-assertions = true

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
debug = false
