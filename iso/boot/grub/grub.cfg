# The loader speaks on the serial line as well as the display: a machine with
# no monitor, or a check that has only a log to read, sees the menu, the
# errors and the hand-off.  The kernel's own console is that same line.
serial --unit=0 --speed=115200
terminal_input console serial
terminal_output console serial

# A graphics mode, kept for the kernel: GRUB sets it and passes the
# framebuffer it set as a Multiboot2 tag, which is the only framebuffer a
# machine with no display driver of its own has.  `keep` means the kernel sees
# the same mode the menu was drawn in.
insmod all_video
set gfxmode=1024x768x32
set gfxpayload=keep

set timeout=0
set default=0
menuentry "protofire" {
    multiboot2 /boot/protofire.elf
    boot
}
