# File: .github/workflows/ci.yml
# Purpose: CI for the protofire kernel repo.  The kernel is self-contained
# (shared shell/runtime logic and demo ELF builders are merged into the
# kernel crate) and needs no external distribution to build.
#
#   quality-gates  - the Linux verification gates (check, verify-p0, clippy)
#   host-check     - the environment check, type-check, clippy, the three
#                    bare-metal builds and (on x86_64) the host test suite, on
#                    every supported host: Linux, Windows, Intel macOS and
#                    Linux arm64 (see README -> Host requirements)
#   commit-message - the commit-msg hook over every PR commit

name: ci

on:
  push:
  pull_request:

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gate:
          - name: check
            command: make check
          - name: verify-p0
            command: make verify-p0
          - name: clippy
            command: make clippy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "nightly-2026-08-24"
          components: rustfmt, clippy, llvm-tools-preview
          targets: x86_64-unknown-none, aarch64-unknown-none, riscv64gc-unknown-none-elf

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install git hooks
        run: make install-hooks

      - name: Run ${{ matrix.gate.name }}
        run: ${{ matrix.gate.command }}
        env:
          CARGO: cargo

  host-check:
    name: host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            test: true
          - os: windows-latest
            test: true
          # `macos-latest` is arm64; the Intel image is the Mac the host-side
          # test suite needs.
          - os: macos-15-intel
            test: true
          # The checks and the cross-builds are arithmetic on target triples and
          # aarch64 hosts pass them, but the test suite drives x86_64 user-mode
          # code inside the host process, so it needs an x86_64 host.
          - os: ubuntu-24.04-arm
            test: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "nightly-2026-08-24"
          components: rustfmt, clippy, llvm-tools-preview
          targets: x86_64-unknown-none, aarch64-unknown-none, riscv64gc-unknown-none-elf

      - name: Install GNU make and a POSIX shell (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install make --no-progress -y
          # GNU make runs the recipes through `sh`, which the runner ships in
          # Git for Windows rather than on PATH.
          foreach ($dir in @('C:\Program Files\Git\usr\bin', 'C:\msys64\usr\bin')) {
            if (Test-Path $dir) {
              $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
          }

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check the environment
        run: make doctor

      - name: Type-check
        run: make check

      - name: Clippy
        run: make clippy

      - name: Cross-build every bare-metal target
        run: |
          make build
          make build-aarch64
          make build-riscv64

      - name: Host test suite (x86_64 hosts)
        if: matrix.test
        run: make test

  commit-message:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PR commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          chmod +x scripts/hooks/commit-msg
          count=0
          for sha in $(git rev-list "$BASE_SHA..$HEAD_SHA"); do
            git show -s --format=%B "$sha" > /tmp/commit-msg.txt
            scripts/hooks/commit-msg /tmp/commit-msg.txt
            count=$((count + 1))
          done
          echo "validated ${count} commit message(s)"
