# File: Cargo.toml
# Purpose: Cargo package manifest, crate targets, and build profile configuration.

[package]
name = "protofire"
version = "0.8.11"
edition = "2021"
authors = ["Raiden Lumine"]
description = "A Rust bare-metal kernel prototype with a file-oriented user ABI."
license = "Apache-2.0"
# The kernel ships as a signed bundle of images, not as a crate: `publish =
# false` keeps a stray `cargo publish` from offering it to crates.io.  The fuzz
# package says the same for the same reason.
publish = false

# The KASLR tool under `tools/` is a package of its own, so the workspace has
# to name it for cargo's commands to reach it: `cargo fmt --all` formats it,
# `cargo clippy --workspace` lints it, and its lockfile is this one rather than
# a second one it would otherwise keep.  `fuzz/` is deliberately not here —
# it declares its own `[workspace]` and needs crates.io, which is the property
# `fuzz/README.md` argues for — so `make check-fuzz-targets` covers it.
[workspace]
members = ["tools/gen-kaslr-relocs"]

# The lints the whole workspace shares.  The root package opts in below, the
# KASLR tool does the same in its own manifest, and `fuzz/` — a workspace of
# its own, so it cannot inherit anything from here — spells the clippy one out
# directly.  Keeping them here rather than on every clippy command line is what
# makes the policy apply to a clippy run nobody thought about.
[workspace.lints.rust]
# Edition 2024 makes this the default; on edition 2021 it is opt-in, and the
# kernel wants it now: an unsafe operation inside an unsafe function is a
# distinct statement from "this function's contract covers it" — the block is
# where the reason goes, and the compiler checks the placement rather than
# trusting the reader to notice it.
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# `-D warnings` turns warnings into errors and only the command line can ask
# for it, but this lint is allow-by-default: a clippy invocation that does not
# name it does not have it.  Naming it here is what stops the rule from
# depending on every command remembering a flag; `make clippy`,
# `make clippy-targets` and `make check-fuzz-targets` therefore pass only
# `-D warnings`, and `make check-unsafe-comments` stays as the second,
# independent census.
undocumented_unsafe_blocks = "deny"

[lints]
workspace = true

[lib]
name = "protofire"
crate-type = ["rlib"]

