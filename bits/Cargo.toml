# File: bits/Cargo.toml
# Purpose: The parts of this kernel that nothing else in it depends on.
#
# Why this crate exists
# --------------------
# Ten top-level modules under `src/` each depend on the other nine, and the
# cycles are not design decisions — they are leaf services filed in the wrong
# layer.  `fs` needs a `Mutex`; `kernel` needs a timer; almost everything
# needs `Error`.  A module that owns an algorithm has no business also owning
# the error type every module uses.
#
# This crate is where the leaves go: no `crate::` references at all, only
# `core` and `alloc`.  A module that can name this crate instead of reaching
# into `kernel` stops being part of a cycle, and the rule is mechanical — if a
# file cannot compile without `crate::`, it does not belong here.

[package]
name = "protofire-bits"
version = "0.1.0"
edition = "2021"
publish = false

[lints]
workspace = true

[lib]
name = "protofire_bits"
crate-type = ["rlib"]
