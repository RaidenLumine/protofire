# The loader speaks on the serial line as well as the display: a machine with
# no monitor, or a check that has only a log to read, sees the menu, the
# errors and the hand-off.  The kernel's own console is that same line.
serial --unit=0 --speed=115200
terminal_input console serial
terminal_output console serial

set timeout=0
set default=0
menuentry "protofire" {
    multiboot2 /boot/protofire.elf
    boot
}
