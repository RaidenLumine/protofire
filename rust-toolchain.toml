# File: rust-toolchain.toml
# Purpose: Pinned Rust toolchain, components, and targets used by this repository.

[toolchain]
channel = "nightly-2026-08-24"
profile = "minimal"
components = ["clippy", "rustfmt", "llvm-tools-preview"]
# The aarch64 *host* target is here because `make check` type-checks that
# configuration: every architecture module is written to compile on a host as
# well, and `check-aarch64-host` is what asks.  It has to be installed for the
# check to be able to run at all — on a machine that is not aarch64.
targets = [
    "x86_64-unknown-none",
    "aarch64-unknown-none",
    "riscv64gc-unknown-none-elf",
    "aarch64-unknown-linux-gnu",
]
