# File: .github/workflows/ci.yml
# Purpose: CI for the protofire kernel repo.  The kernel is self-contained
# (shared shell/runtime logic and demo ELF builders are merged into the
# kernel crate) and needs no external distribution to build.

name: ci

on:
  push:
  pull_request:

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gate:
          - name: check
            command: make check
          - name: verify-p0
            command: make verify-p0
          - name: clippy
            command: make clippy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy
          targets: x86_64-unknown-none

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run ${{ matrix.gate.name }}
        run: ${{ matrix.gate.command }}
        env:
          CARGO: cargo
