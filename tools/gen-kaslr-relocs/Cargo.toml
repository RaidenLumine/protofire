[package]
name = "gen-kaslr-relocs"
version = "0.1.0"
edition = "2021"
# Built by `make gen-kaslr-relocs`, never published: the same reason the fuzz
# package states for itself.
publish = false

[[bin]]
name = "gen-kaslr-relocs"
path = "src/main.rs"

# The workspace's lint policy — `unsafe_op_in_unsafe_fn` and
# `clippy::undocumented_unsafe_blocks` — applies here the same way it applies
# to the kernel.
[lints]
workspace = true
