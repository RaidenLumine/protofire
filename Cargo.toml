[features]
default = []
demo-disk = []
# Enables the standalone ring3 runtime bridge (__shell_syscallN wrappers in
# src/user/shared/runtime.rs). Off in the kernel build: the kernel provides its
# own bridge in src/user/program/shell/syscall_bridge.rs.
runtime = []
# Ships the byte-for-byte payload frozen on 2026-09-27 instead of the one this
# build compiles, so the boot runs a program that was not rebuilt.  This is what
# makes "we do not break userspace" a testable claim; see
# `src/user/demo/demo_program_x86_64_rust_io.rs`.
abi_frozen_payload = []
# Ships an init program that reads the declarations and asks for nothing to be
# started, so the boot's other half — the supervisor starting what is still
# pending when the hand-off's deadline passes — is exercised by a boot rather
# than merely reasoned about.  Used by `make check-x8664-init-no-start`.
init_no_start = []
fs_profiler = []
fs_lock_timing = []
heap_audit = []
liveness_heartbeat = []
# Boots a relocated kernel: `kernel_entry` copies the image to a random base
# the machine's memory map allows, patches the compiled-in relocation table's
# sites by the delta, and continues in the copy (`src/arch/x86_64/kaslr.rs`).
# The table is generated by `make gen-kaslr-relocs` from a build with this
# feature on, and `make check-x8664-kaslr-runtime` proves the two agree by
# regenerating until it reaches a fixed point.  x86_64 only; a build with it on
# refuses AP bring-up, because the trampoline enters the link-time address.
kaslr = []
# Asks the stack window and the posted-invalidation log for more than they can
# hold, so the fallbacks (frames at their own addresses, full TLB flushes) are
# exercised rather than merely reasoned about.  Used by the x86_64 runtime
# check; it costs tens of megabytes of frames for the moment it runs.
stack_churn = []
net_profiler = []
# Boots with the loopback device as the network stack's only device, on a
# static address, so the network half of the boot workload has a peer that
# cannot change between boots and needs no host behind it.  Used by
# `make check-perf-baseline-net`; see `src/kernel/workload.rs`.
net_loopback = []
# Simulates the ring-room bookkeeping defect: every completed TD's room is never
# handed back.  The producer's occupancy then grows until `RingRoom` refuses a
# submit with `Busy` — which is the refusal no honest caller reaches, because
# every submit path here waits for its completion and releases in the same call.
# `make check-x8664-usb-room-budget` boots a USB disk with it and requires the
# disk to stop working, which is what proves the accounting is load-bearing.
xhci_ring_room_leak = []
# Makes the timer tick's xHCI drain call the interrupt handler **while it holds
# the rings**, so the handler's `try_lock` fails for real and the miss/acknowledge
# path runs on a machine with no transfer in flight.  That is the case RFC 0021
# exists for — a report the interrupt could not take, drained by the tick — and
# no boot forces it otherwise; `make check-x8664-usb-contention` is the gate.
xhci_contention = []
# Prints one line of measured boot work at a fixed tick, so a boot's counters
# can be compared against a recorded baseline (`make check-perf-baseline`).
perf_baseline = []
alloc_profiler = []
fault_profiler = []
educational_networking = []

[dependencies]

[profile.dev]
panic = "abort"
opt-level = 1
# Line tables only.  Full DWARF made the debug kernel 149 MB per architecture
# for a debugger workflow nothing in the tree documents, and it is the largest
# single cost in a link; `debug = 1` keeps file and line in a backtrace (and in
# a panic's `Location`) without the type and variable records.
debug = 1
debug-assertions = true

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
debug = false
