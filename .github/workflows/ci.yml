# File: .github/workflows/ci.yml
# Purpose: CI for the protofire kernel repo.  The kernel is self-contained
# (shared shell/runtime logic and demo ELF builders are merged into the
# kernel crate) and needs no external distribution to build.
#
#   quality-gates  - the Linux verification gates (check, verify-p0, clippy)
#   host-check     - the environment check, type-check, clippy, the three
#                    bare-metal builds and (on x86_64) the host test suite, on
#                    every supported host: Linux, Windows, Intel macOS and
#                    Linux arm64 (see README -> Host requirements)
#   smp-runtime    - boot the kernel on four emulated CPUs and check that it
#                    comes up and keeps making progress.  Every other gate
#                    runs on one CPU, where the cross-CPU paths cannot execute
#                    at all.
#   commit-message - the commit-msg hook over every PR commit

name: ci

on:
  push:
  pull_request:

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gate:
          - name: check
            command: make check
          - name: verify-p0
            command: make verify-p0
          - name: clippy
            command: make clippy
          # The rest of the gates `make verify-p3` runs locally.  They were not
          # in any CI job, which left the machine weaker than the developer's
          # own `make verify`: the layering, architecture-fanout and
          # unsafe-comment ratchets are what catch a change that moves a
          # dependency or a number rather than breaking a build, and clippy on
          # the four non-host configurations is what caught the fifteen missing
          # `# Safety` sections nobody had looked for.
          - name: clippy-targets
            command: make clippy-targets
          - name: unsafe-comments
            command: make check-unsafe-comments
          - name: layering
            command: make check-layering
          - name: arch-fanout
            command: make check-arch-fanout
          - name: payload-relocations
            command: make check-payload-relocations
          - name: dead-code-allows
            command: make check-dead-code-allows
          - name: abi-mirror
            command: make check-abi-mirror
          # `git fsck` in a shallow clone (what `actions/checkout` makes by
          # default) reports nothing and exits zero, so this runs as it does in
          # a full checkout here.
          - name: repo-integrity
            command: make check-repo-integrity

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "nightly-2026-08-24"
          components: rustfmt, clippy, llvm-tools-preview
          # aarch64-unknown-linux-gnu is the host configuration `make check`
          # type-checks; without it that step cannot find `core` for the
          # target and every job that runs it fails.
          #
          # x86_64-apple-darwin is what `make clippy-targets` lints to stand in
          # for the macOS and Windows jobs, whose `target_os` is the difference
          # that matters.  No linker is needed: the check stops at clippy.
          targets: x86_64-unknown-none, aarch64-unknown-none, riscv64gc-unknown-none-elf, aarch64-unknown-linux-gnu, x86_64-apple-darwin

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install git hooks
        run: make install-hooks

      - name: Run ${{ matrix.gate.name }}
        run: ${{ matrix.gate.command }}
        env:
          CARGO: cargo

  smp-runtime:
    # The only gate that starts the kernel more than once — and the only one
    # that starts it on more than one CPU, which is the only way the AP
    # bring-up and cross-CPU paths run.
    #
    # It uses the default accelerator: GitHub's runners may or may not expose
    # /dev/kvm, and QEMU falls back to TCG, which is what this check wants
    # anyway — emulated timing interleaves vCPUs genuinely without depending
    # on the hardware underneath.
    name: runtime smokes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "nightly-2026-08-24"
          components: rustfmt, clippy, llvm-tools-preview
          # aarch64-unknown-linux-gnu is the host configuration `make check`
          # type-checks; without it that step cannot find `core` for the
          # target and every job that runs it fails.
          targets: x86_64-unknown-none, aarch64-unknown-none, riscv64gc-unknown-none-elf, aarch64-unknown-linux-gnu

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install QEMU
        run: |
          sudo apt-get update
          # `qemu-system-misc` carries the aarch64 and riscv64 system emulators
          # the frozen-payload gates need, but the QEMU 10 packages split the
          # riscv64 emulator out into `qemu-system-riscv`: ask for it when the
          # binary is still missing afterwards, because a gate that cannot find
          # its emulator is a red that says nothing about the kernel.
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-system-misc
          if ! command -v qemu-system-riscv64 >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends qemu-system-riscv
          fi

      - name: Boot on four CPUs
        run: make check-smp-runtime SMP=4

      # The one gate that runs a program that was not rebuilt with the kernel:
      # the payload frozen on 2026-09-27 is shipped instead of the compiled one,
      # and the boot has to produce the same user output.  Without it, "we do
      # not break userspace" cannot be false — a payload rebuilt with the kernel
      # would hide an ABI change by construction.
      - name: Boot the frozen payload
        run: make check-abi-frozen-payload

      - name: Boot the frozen riscv64 payload
        run: make check-abi-frozen-payload-riscv64

      - name: Boot the frozen aarch64 payload
        run: make check-abi-frozen-payload-aarch64
        env:
          CARGO: cargo
          SMP_RUNTIME_LOG: smp-runtime.log
          # Deliberately the plain build.  The `liveness_heartbeat` build
          # currently stalls during AP bring-up on some machines, which is a
          # defect this job should not be mixed up with.
          FEATURES: demo-disk

      # The other two architectures' cross-CPU paths.  `check-smp-runtime` is
      # x86_64, and the single-CPU smokes above cannot reach a second CPU at
      # all, so without these two the AArch64 and RISC-V AP bring-up is a code
      # path no automated run takes.
      - name: Boot four AArch64 CPUs
        run: make check-aarch64-smp-runtime SMP=4

      - name: Boot four RISC-V CPUs
        run: make check-riscv64-smp-runtime SMP=4

      # And the two boots that ask for more than the stack window and the
      # invalidation log can hold.  They are the only way either fallback is
      # reached, and they were the two gates that ran in no chain at all.
      - name: Exhaust the stack window and the invalidation log
        run: make check-x8664-churn

      - name: Exhaust them on RISC-V too
        run: make check-riscv64-churn

      # And the same kernel on the AIA machine, where the IMSIC — the file that
      # receives MSIs — is the external-interrupt controller.  No other boot
      # reaches that path: the default machine serves interrupts from a PLIC.
      - name: Boot RISC-V with the AIA interrupt controller
        run: make check-riscv64-aia-runtime

      - name: Upload the serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smp-runtime-log
          path: smp-runtime.log
          if-no-files-found: ignore

  host-check:
    name: host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            test: true
          - os: windows-latest
            test: true
          # `macos-latest` is arm64; the Intel image is the Mac the host-side
          # test suite needs.
          - os: macos-15-intel
            test: true
          # The checks and the cross-builds are arithmetic on target triples and
          # aarch64 hosts pass them, but the test suite drives x86_64 user-mode
          # code inside the host process, so it needs an x86_64 host.
          - os: ubuntu-24.04-arm
            test: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "nightly-2026-08-24"
          components: rustfmt, clippy, llvm-tools-preview
          # aarch64-unknown-linux-gnu is the host configuration `make check`
          # type-checks; without it that step cannot find `core` for the
          # target and every job that runs it fails.
          targets: x86_64-unknown-none, aarch64-unknown-none, riscv64gc-unknown-none-elf, aarch64-unknown-linux-gnu

      - name: Install GNU make and a POSIX shell (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install make --no-progress -y
          # GNU make runs the recipes through `sh`, which the runner ships in
          # Git for Windows rather than on PATH.
          foreach ($dir in @('C:\Program Files\Git\usr\bin', 'C:\msys64\usr\bin')) {
            if (Test-Path $dir) {
              $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
          }

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check the environment
        run: make doctor

      - name: Type-check
        run: make check

      - name: Clippy
        run: make clippy

      - name: Cross-build every bare-metal target
        run: |
          make build
          make build-aarch64
          make build-riscv64

      - name: Host test suite (x86_64 hosts)
        if: matrix.test
        run: make test

  commit-message:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PR commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          chmod +x scripts/hooks/commit-msg
          count=0
          for sha in $(git rev-list "$BASE_SHA..$HEAD_SHA"); do
            git show -s --format=%B "$sha" > /tmp/commit-msg.txt
            scripts/hooks/commit-msg /tmp/commit-msg.txt
            count=$((count + 1))
          done
          echo "validated ${count} commit message(s)"
